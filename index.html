<!doctype html>
<html lang="ko" data-theme="blue-archive">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#eaf1fa" />
  <meta name="description" content="여러 게임의 공식 캐릭터 일러스트와 자켓을 모아보는 정적 갤러리" />
  <title>캐릭터 아트 갤러리</title>
  <script>
    try {
      const mode = localStorage.getItem('cg-mode');
      if (mode === 'dark' || (!mode && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset.mode = 'dark';
      }
    } catch {}
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./skins.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button id="backButton" class="header-icon" type="button" aria-label="뒤로" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button id="homeButton" class="brand" type="button" aria-label="홈으로 이동">
        <span class="brand-mark"><span class="brand-dot"></span></span>
      </button>
      <div class="header-copy">
        <strong id="headerTitle">캐릭터 아트 갤러리</strong>
        <small id="headerSubtitle">공식 일러부터 팬아트까지</small>
      </div>
      <div class="header-actions">
        <div id="routeActions" class="route-actions"></div>
        <button id="colorModeToggle" class="header-icon mode-toggle" type="button" aria-label="다크 모드로" title="다크 모드로">
          <svg class="mode-icon mode-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <svg class="mode-icon mode-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" />
            <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <div id="status" class="status" aria-live="polite"></div>
      </div>
    </div>
  </header>

  <main id="app" class="app" tabindex="-1"></main>

  <dialog id="lightbox" class="lightbox" aria-labelledby="lightboxTitle">
    <div class="lightbox-topbar">
      <div class="lightbox-context">
        <span id="lightboxSourceLabel" class="lightbox-source"></span>
        <span id="lightboxTopMeta" class="lightbox-top-meta"></span>
        <span id="lightboxCounter" class="lightbox-counter" aria-live="polite"></span>
      </div>
      <div class="lightbox-actions">
        <button id="copyImageUrl" class="lightbox-action" type="button">주소 복사</button>
        <a id="openSource" class="lightbox-action primary" target="_blank" rel="noopener noreferrer">원본 ↗</a>
        <button id="lightboxClose" class="lightbox-close" type="button" aria-label="닫기" autofocus>×</button>
      </div>
    </div>

    <div id="lightboxStage" class="lightbox-stage">
      <button id="lightboxPrev" class="lightbox-nav prev" type="button" aria-label="이전 이미지">‹</button>
      <div id="lightboxImageWrap" class="lightbox-image-wrap">
        <img id="lightboxImage" alt="" draggable="false" />
        <div id="lightboxImageError" class="lightbox-image-error" hidden>
          <span>이미지를 불러올 수 없어요.</span>
          <a id="lightboxErrorSource" target="_blank" rel="noopener noreferrer">원본 열기</a>
        </div>
      </div>
      <button id="lightboxNext" class="lightbox-nav next" type="button" aria-label="다음 이미지">›</button>
    </div>

    <div class="lightbox-footer">
      <div class="lightbox-caption">
        <h2 id="lightboxTitle"></h2>
        <p id="lightboxMeta"></p>
      </div>
      <div id="variantButtons" class="variant-buttons" hidden></div>
      <div class="lightbox-mobile-nav">
        <button id="lightboxPrevMobile" type="button" aria-label="이전 이미지">‹ 이전</button>
        <span id="lightboxCounterMobile"></span>
        <button id="lightboxNextMobile" type="button" aria-label="다음 이미지">다음 ›</button>
      </div>
    </div>
  </dialog>

  <script src="./app.js" defer></script>
  <script src="./skins.js" defer></script>
</body>
</html>
