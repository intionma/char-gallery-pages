<!doctype html>
<html lang="ko" data-theme="blue-archive">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#eaf1fa" />
  <meta name="description" content="여러 게임의 공식 캐릭터 일러스트와 자켓을 모아보는 정적 갤러리" />
  <title>캐릭터 아트 갤러리</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./skins.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button id="backButton" class="header-icon" type="button" aria-label="뒤로" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button id="homeButton" class="brand" type="button" aria-label="홈으로 이동">
        <span class="brand-mark"><span class="brand-dot"></span></span>
      </button>
      <div class="header-copy">
        <strong id="headerTitle">캐릭터 아트 갤러리</strong>
        <small id="headerSubtitle">공식 일러부터 팬아트까지</small>
      </div>
      <div class="header-actions">
        <div id="status" class="status" aria-live="polite"></div>
      </div>
    </div>
  </header>

  <main id="app" class="app" tabindex="-1"></main>

  <dialog id="lightbox" class="lightbox">
    <button id="lightboxClose" class="lightbox-close" type="button" aria-label="닫기">×</button>
    <div class="lightbox-stage">
      <img id="lightboxImage" alt="" />
    </div>
    <div class="lightbox-panel">
      <div>
        <h2 id="lightboxTitle"></h2>
        <p id="lightboxMeta"></p>
      </div>
      <div class="lightbox-actions">
        <button id="copyImageUrl" class="button secondary" type="button">이미지 주소 복사</button>
        <a id="openSource" class="button" target="_blank" rel="noopener noreferrer">원본 열기</a>
      </div>
      <div id="variantButtons" class="variant-buttons"></div>
    </div>
  </dialog>

  <script src="./app.js" defer></script>
  <script src="./skins.js" defer></script>
</body>
</html>
