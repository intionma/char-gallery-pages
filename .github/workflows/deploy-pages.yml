name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'app.js'
      - 'skins.js'
      - 'scripts/**'
      - '.github/workflows/deploy-pages.yml'
      - 'README.md'
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check skins.js
          node --check scripts/build-data.mjs
          node --check scripts/build-blue-archive-skins.mjs
          node --check scripts/build-eternal-return-skins.mjs
          node --check scripts/build-genshin-skins.mjs
          node --check scripts/enrich-gallery.mjs
          node --check scripts/normalize-sdvx.mjs
          node --check scripts/sdvx-jacket-ratings.mjs
          node --check scripts/games/registry.mjs
          node --check scripts/build-registry.mjs
          node --check scripts/adapters/shared.mjs
          node --check scripts/sort-utils.mjs
          node --check scripts/test-sort-metadata.mjs
          node --check scripts/validate-data.mjs
          node --check scripts/audit-public.mjs
      - name: Test sort metadata
        run: node scripts/test-sort-metadata.mjs
      - name: Prepare static site
        run: |
          rm -rf dist
          mkdir -p dist/data
          cp index.html 404.html styles.css skins.css app.js skins.js dist/
          touch dist/.nojekyll
      - name: Generate game registry assets
        run: node scripts/build-registry.mjs dist
      - name: Build public data snapshot
        run: node scripts/build-data.mjs dist/data
      - name: Build Blue Archive skin catalog
        run: node scripts/build-blue-archive-skins.mjs dist/data/blue-archive.json
      - name: Build Eternal Return skin catalog
        run: node scripts/build-eternal-return-skins.mjs dist/data/eternal-return.json
      - name: Build Genshin skin catalog
        run: node scripts/build-genshin-skins.mjs dist/data/genshin.json
      - name: Restore detail galleries and game logos
        run: node scripts/enrich-gallery.mjs dist/data
      - name: Normalize SDVX jacket URLs
        run: node scripts/normalize-sdvx.mjs dist/data/sound-voltex.json
      - name: Validate generated data
        run: node scripts/validate-data.mjs dist/data
      - name: Audit public source
        run: node scripts/audit-public.mjs
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4