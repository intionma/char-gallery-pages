name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Prepare static site
        run: |
          rm -rf dist
          mkdir -p dist/data
          cp index.html 404.html styles.css app.js dist/
          touch dist/.nojekyll
      - name: Build public data snapshot
        run: node scripts/build-data.mjs dist/data
      - name: Normalize SDVX jacket URLs
        run: node scripts/normalize-sdvx.mjs dist/data/sound-voltex.json
      - name: Audit public source
        run: node scripts/audit-public.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
